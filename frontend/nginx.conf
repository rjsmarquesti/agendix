server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page principal — root do domínio
    location = / {
        try_files /landingpage-agendix-v2.html =404;
    }

    # Landing pages por nicho
    location = /estetica   { try_files /nicho-esteticista.html =404; }
    location = /salao      { try_files /nicho-salao.html =404; }
    location = /advocacia  { try_files /nicho-advogado.html =404; }
    location = /psicologia { try_files /nicho-psicologo.html =404; }
    location = /otica      { try_files /nicho-otica.html =404; }

    # Landing pages antigas (compatibilidade)
    location = /landingpage-agendix.html {
        try_files $uri =404;
    }

    location = /landingpage-agendix-white.html {
        try_files $uri =404;
    }

    location = /landingpage-agendix-v2.html {
        try_files $uri =404;
    }

    # App React (SPA) — todas as outras rotas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Formulário público de agendamento — match exato tem prioridade máxima no nginx
    location = /agendar.html {
        proxy_pass http://agendix-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # PWA assets servidos pelo backend
    location ~ ^/(manifest\.json|sw\.js)(.*)?$ {
        proxy_pass http://agendix-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para a API do backend
    location /api/ {
        proxy_pass http://agendix-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
