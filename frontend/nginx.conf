server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redireciona todas as rotas para o React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Formulário público de agendamento — match exato tem prioridade máxima no nginx
    location = /agendar.html {
        proxy_pass http://agendix-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # PWA assets servidos pelo backend
    location ~ ^/(manifest\.json|sw\.js)(.*)?$ {
        proxy_pass http://agendix-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para a API do backend
    location /api/ {
        proxy_pass http://agendix-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
